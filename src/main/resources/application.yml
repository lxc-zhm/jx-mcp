spring:
  application:
    name: jx-mcp
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres-pgvector.orb.local:5432/jx}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:zxcv+1234}
  ai:
    model:
      # 本 server 只做 embedding + 工具，关闭不需要的模型能力，避免无关 starter 强制要 API key
      chat: none
      image: none
      moderation: none
      decision: none
      audio:
        speech: none
        transcription: none
      embedding: ${EMBEDDING_PROVIDER:ollama}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${OLLAMA_MODEL:bge-m3}
    vectorstore:
      pgvector:
        initialize-schema: false
        id-type: BIGSERIAL
        dimensions: ${EMBEDDING_DIM:1024}
        index-type: HNSW
        distance-type: COSINE_DISTANCE
    mcp:
      server:
        name: jx-mcp
        version: 0.1.0
        type: SYNC
        annotation-scanner:
          enabled: true
