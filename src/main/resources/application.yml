spring:
  application:
    name: jx-mcp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jx}
    username: ${DB_USER:jx_mcp_app}
    password: ${DB_PASSWORD:jx_mcp_app}
  ai:
    model:
      embedding: ${EMBEDDING_PROVIDER:ollama}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${OLLAMA_MODEL:bge-m3}
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: ${EMBEDDING_DIM:1024}
        index-type: HNSW
        distance-type: COSINE_DISTANCE
    mcp:
      server:
        name: jx-mcp
        version: 0.1.0
        type: SYNC
        annotation-scanner:
          enabled: true
